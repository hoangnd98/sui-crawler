basePath: /
definitions:
  api.CreateJobRequest:
    properties:
      endCheckpoint:
        example: 1000
        minimum: 0
        type: integer
      fromCheckpoint:
        example: 0
        minimum: 0
        type: integer
    required:
    - endCheckpoint
    - fromCheckpoint
    type: object
  api.ErrorResponse:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  api.JobResponse:
    properties:
      completed_at:
        example: "2026-04-24T16:00:00Z"
        type: string
      created_at:
        example: "2026-04-24T15:00:00Z"
        type: string
      endCheckpoint:
        example: 1000
        type: integer
      error:
        example: ""
        type: string
      fromCheckpoint:
        example: 0
        type: integer
      id:
        example: 682a1b2c3d4e5f6a7b8c9d0e
        type: string
      lastCheckpoint:
        example: 499
        type: integer
      status:
        example: progressing
        type: string
      updated_at:
        example: "2026-04-24T15:00:00Z"
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing SUI checkpoint crawling jobs
  title: SUI Crawler API
  version: "1.0"
paths:
  /api/v1/jobs:
    get:
      description: List all crawler jobs with optional status filter
      parameters:
      - description: Filter by status (pending, progressing, completed)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.JobResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List crawler jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Create a new SUI checkpoint crawling job with explicit checkpoint
        boundaries
      parameters:
      - description: Job configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create a new crawler job
      tags:
      - jobs
  /api/v1/jobs/{id}:
    get:
      description: Retrieve detailed information about a specific crawler job
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get a crawler job by ID
      tags:
      - jobs
  /api/v1/jobs/{id}/retry:
    post:
      description: Transition a job back to pending status to resume or restart it,
        regardless of its current state
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Retry a crawler job
      tags:
      - jobs
swagger: "2.0"
